[project]
name = "pixel2layer-api"
version = "0.1.0"
description = "Pixel2Layer reconstruction API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "pyjwt>=2.8",
    "asyncpg>=0.30",
    "pillow>=10.4",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.4.6",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "sam2>=1.0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]
