services:
  postgres:
    image: postgres:16-alpine
    container_name: pixel2layer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixel2layer
      POSTGRES_PASSWORD: pixel2layer
      POSTGRES_DB: pixel2layer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixel2layer -d pixel2layer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pixel2layer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: